<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>메이플 랜덤 디펜스 가이드</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">🍁</span>
      <div>
        <h1>메이플 랜덤 디펜스 가이드</h1>
        <p class="subtitle">뽑은 유닛을 카운트하고 목표 스테이지를 고르면, 데미지 타입·크기 배율에 맞춰 최적 유닛/업그레이드를 추천합니다.</p>
      </div>
    </div>
    <div class="topbar-actions">
      <div class="stage-nav">
        <button id="stagePrev" class="btn ghost">◀</button>
        <select id="stageSelect"></select>
        <button id="stageNext" class="btn ghost">▶</button>
      </div>
      <button id="resetBtn" class="btn ghost" title="카운트/업그레이드 초기화">초기화</button>
    </div>
  </header>

  <main class="layout">
    <!-- 보유 유닛 -->
    <section class="panel units-panel">
      <h2>보유 유닛 <span class="hint">뽑으면 + · 팔면 −</span></h2>
      <div id="unitList" class="unit-list"></div>

      <h3>업그레이드</h3>
      <div id="upgradeList" class="upgrade-list"></div>

      <h3>데미지 배율표</h3>
      <table class="mod-table" id="modTable"></table>

      <h3>뽑기 확률 계산기 <span class="hint">10미네랄/뽑기</span></h3>
      <div class="gacha">
        <label>뽑기 횟수
          <input id="gachaPulls" type="number" min="1" value="100" />
        </label>
        <div id="gachaCost" class="sub"></div>
        <table class="mod-table" id="gachaTable"></table>
      </div>

      <h3>클리어 스펙 (전설 환산) <span class="hint">목표 7기</span></h3>
      <div id="clearSpec" class="clearspec"></div>
    </section>

    <!-- 스테이지 적 정보 -->
    <section class="panel stage-panel">
      <h2 id="stageTitle">스테이지</h2>
      <div id="enemyTable" class="enemy-table"></div>
    </section>

    <!-- 추천 -->
    <section class="panel rec-panel">
      <h2>추천 &amp; 분석</h2>
      <div class="stat-row">
        <div class="stat"><span class="stat-label">총 유닛</span><span id="statUnits" class="stat-val">0</span></div>
        <div class="stat"><span class="stat-label">이번 스테이지 화력</span><span id="statPower" class="stat-val">0</span></div>
      </div>

      <h3>이번 스테이지 최적 유닛</h3>
      <div id="bestUnit" class="rec-list"></div>

      <h3>업그레이드 우선순위</h3>
      <div id="upgradeRec" class="rec-list"></div>

      <h3>판매 조언</h3>
      <div id="sellAdvice" class="rec-list"></div>

      <h3>코치 노트</h3>
      <div id="notes" class="notes"></div>
    </section>
  </main>

  <footer class="footer"><span id="dataNote"></span></footer>

  <script src="engine.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
